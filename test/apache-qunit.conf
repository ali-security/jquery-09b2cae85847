Listen 8080

<VirtualHost 127.0.0.1:8080>
	DocumentRoot @DOCROOT@
	DirectoryIndex index.html index.php

	<Directory @DOCROOT@>
		Options Indexes FollowSymLinks
		AllowOverride None
		Require all granted
	</Directory>

	# Load-bearing: without no-cache, Apache's ETag/Last-Modified let the
	# support and offset test iframes serve stale documents, which fails six
	# assertions that pass against a non-caching server.
	<IfModule mod_headers.c>
		Header set Cache-Control "no-store, no-cache, must-revalidate"
		Header set Pragma "no-cache"
	</IfModule>
</VirtualHost>
